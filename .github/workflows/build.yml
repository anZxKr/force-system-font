name: Build

on:
  push:
    branches: [main, debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - if: github.ref_name != 'main'
        run: ./gradlew assembleDebug
      - if: github.ref_name != 'main'
        uses: actions/upload-artifact@v7
        with:
          name: ForceSystemFont-debug
          path: app/build/outputs/apk/debug/*.apk

      - if: github.ref_name == 'main'
        run: ./gradlew assembleRelease
      - if: github.ref_name == 'main'
        run: |
          tag=v$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released, skipping"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "ForceSystemFont-$tag.apk"
          gh release create "$tag" "ForceSystemFont-$tag.apk" --target "$GITHUB_SHA" --generate-notes

