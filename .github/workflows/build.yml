name: Build

on:
  push:
    branches: [main, debug]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - if: github.event_name != 'release'
        run: ./gradlew assembleDebug
      - if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ForceSystemFont-debug
          path: app/build/outputs/apk/debug/*.apk

      - if: github.event_name == 'release'
        run: ./gradlew assembleRelease
      - if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ForceSystemFont-$TAG.apk"
          gh release upload "$TAG" "ForceSystemFont-$TAG.apk" --clobber
